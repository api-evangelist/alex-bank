    type: APIReference
  - url: openapi/alex-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Transactions surface of Alex Bank's CDR Banking API, per the
    DSB Consumer Data Standards (CDR Banking API v1.36.0). Covers GET
    /banking/accounts/{accountId}/transactions (list, with date/amount/text filters) and GET
    /banking/accounts/{accountId}/transactions/{transactionId} (transaction detail). Accessed by
    accredited data recipients over the CDR mTLS/InfoSec channel under an active consent grant; it
    is not exposed on the public unauthenticated PRD host.
