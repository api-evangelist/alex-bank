apis:
- aid: alex-bank:alex-bank-cdr-product-reference-data-api
  name: Alex Bank CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking
  - Public API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.alex.bank/legal/open-banking/
  baseURL: https://public.cdr.alex.com.au/cds-au/v1/banking/products
  properties:
  - url: https://www.alex.bank/legal/open-banking/
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-products
    type: APIReference
  - url: openapi/alex-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Product Reference Data (PRD) API conforming to the
    DSB Consumer Data Standards (CDR Banking API). Confirmed live at
    https://public.cdr.alex.com.au/cds-au/v1/banking/products (HTTP 200, x-v 3) returning a
    data.products array of Alex Bank's deposit and lending products (term deposits, savings,
    personal/green/car/EV loans) with rates, fees, features and eligibility. Exposes GET
    /banking/products and GET /banking/products/{productId}; no API key or OAuth required.
- aid: alex-bank:alex-bank-cdr-accounts-balances-api
  name: Alex Bank CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Accounts
  - Balances
  - Banking
  - Consumer Authorized
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.alex.bank/legal/open-banking/
  baseURL: https://public.cdr.alex.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.alex.bank/legal/open-banking/
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-accounts
    type: APIReference
  - url: openapi/alex-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Accounts & Balances surface of Alex Bank's CDR Banking
    API, standardized by the DSB Consumer Data Standards (CDR Banking API v1.36.0). Covers
    GET /banking/accounts (list authorized accounts), GET /banking/accounts/balances (bulk
    balances), GET /banking/accounts/{accountId}/balance, and GET /banking/accounts/{accountId}
    (account detail). These endpoints are NOT public - they are consumed by APRA-accredited
    data recipients (ADRs) over the CDR mTLS/InfoSec channel after the customer grants consent
    through Alex Bank's CDR consent portal; they are not reachable on the unauthenticated PRD host.
