    GET /banking/accounts/{accountId}/direct-debits and POST /banking/accounts/direct-debits (bulk),
    plus GET /banking/accounts/{accountId}/payments/scheduled and POST /banking/payments/scheduled
    (bulk). Consumed by accredited data recipients over the CDR mTLS/InfoSec channel under customer
    consent; not available on the unauthenticated PRD host.
